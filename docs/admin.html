<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel właściciela: apartament morze</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a4be0'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">apartament morze</a>
  <nav aria-label="Główne"><a href="./">Strona gościa</a><span id="who"></span></nav>
</header>
<p class="banner" id="banner" hidden></p>
<main>
  <section class="hero" style="padding-bottom:24px"><h1 class="display" style="font-size:clamp(2.5rem,6vw,5rem)">panel właściciela</h1></section>
  <form class="login" id="login" hidden>
    <label>Hasło<input type="password" name="password" autocomplete="current-password" required></label>
    <span class="err" id="loginErr"></span>
    <button class="btn" type="submit">Zaloguj</button>
  </form>
  <div class="wrap" id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="group" aria-label="Widok">
      <button type="button" data-tab="new" aria-pressed="true">Nowe</button>
      <button type="button" data-tab="confirmed" aria-pressed="false">Potwierdzone</button>
      <button type="button" data-tab="declined" aria-pressed="false">Odrzucone</button>
      <button type="button" data-tab="blocks" aria-pressed="false">Blokady</button>
    </div>
    <div id="list"></div>
    <p><button class="btn ghost sm" type="button" id="logout">Wyloguj</button> <button class="btn ghost sm" type="button" id="reset" hidden>Zresetuj dane demo</button></p>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
